name: Build StudioX AI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ffmpeg_variant:
        description: "FFmpeg build bundled with the installer (lgpl or gpl)"
        default: "lgpl"
      build_macos:
        description: "Also build the macOS app (macOS minutes count 10x in private repos)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:export

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      - name: Bundle FFmpeg
        run: npm run fetch-ffmpeg
        env:
          FFMPEG_VARIANT: ${{ github.event.inputs.ffmpeg_variant || 'lgpl' }}
      - name: Build installer (NSIS .exe + MSI)
        shell: pwsh
        run: |
          # the bundler downloads NSIS/WiX; retry on transient network errors
          for ($i = 1; $i -le 3; $i++) {
            npx tauri build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Build attempt $i failed, retrying in 60 s…"
            Start-Sleep -Seconds 60
          }
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: StudioX-AI-windows-x64
          retention-days: 14 # artifacts count against the 500 MB storage quota of private repos
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    needs: test
    # only on demand: macOS runner minutes are billed at 10x for private repositories
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos == 'true'
    runs-on: macos-latest
    continue-on-error: true # macOS is a future platform; FFmpeg is taken from Homebrew/PATH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: StudioX-AI-macos
          retention-days: 14
          path: src-tauri/target/release/bundle/dmg/*.dmg
