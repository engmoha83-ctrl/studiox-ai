name: Build StudioX AI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ffmpeg_variant:
        description: "FFmpeg build bundled with the installer (lgpl or gpl)"
        default: "lgpl"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:export

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      - name: Bundle FFmpeg
        run: npm run fetch-ffmpeg
        env:
          FFMPEG_VARIANT: ${{ github.event.inputs.ffmpeg_variant || 'lgpl' }}
      - name: Build installer (NSIS .exe + MSI)
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: StudioX-AI-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    continue-on-error: true # macOS is a future platform; FFmpeg is taken from Homebrew/PATH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: StudioX-AI-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
