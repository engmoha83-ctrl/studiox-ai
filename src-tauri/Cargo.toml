[package]
name = "studiox-ai"
version = "0.1.2"
description = "STUDIOX AI — professional AI-powered desktop video editor"
authors = ["StudioX"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "studiox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
base64 = "0.22"
sysinfo = "0.40"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
